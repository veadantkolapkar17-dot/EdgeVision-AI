<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111c35"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.5"/>
  
  <!-- Outer AI Reticle Frame -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Corner Reticle Bounding Box Marks -->
  <path d="M 140 180 L 140 140 L 180 140" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  <path d="M 332 140 L 372 140 L 372 180" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  <path d="M 140 332 L 140 372 L 180 372" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  <path d="M 332 372 L 372 372 L 372 332" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>

  <!-- Neural Central Core -->
  <circle cx="256" cy="256" r="42" fill="#10b981" opacity="0.15"/>
  
  <!-- Stylized EV Typography -->
  <text x="256" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">EV</text>
  <text x="256" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="6">EDGE AI</text>
</svg>